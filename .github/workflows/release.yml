name: Build update release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build or verify an existing release'
        required: true
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check version tag
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($releaseVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $env:RELEASE_TAG -ne "v$releaseVersion") { throw 'Tag must match package version.' }
      - name: Avoid rebuilding an existing published release
        id: release_status
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $result = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $result | ConvertFrom-Json
            if (-not $release.draft) {
              $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $required = @("FilePreview-Setup-$releaseVersion-x64.exe", "FilePreview-Setup-$releaseVersion-x64.exe.blockmap", 'latest.yml', 'SHA256SUMS.txt')
              foreach ($name in $required) {
                if (-not ($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' -and $_.size -gt 0 })) { throw "Published release is incomplete: $name" }
              }
              'published=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Output 'Complete published release exists. Keeping its verified assets unchanged.'
              exit 0
            }
          } else {
            $status = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --include 2>$null
            if (($status -join "`n") -notmatch 'HTTP/\S+ 404') { throw 'Cannot safely inspect release state.' }
          }
          'published=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - run: npm ci
        if: steps.release_status.outputs.published != 'true'
      - name: Build unsigned NSIS and verify update artifacts
        if: steps.release_status.outputs.published != 'true'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node --import tsx scripts/icon.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx scripts/build-electron.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx scripts/associations.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx scripts/copy-assets.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create reviewable draft release
        if: steps.release_status.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "$env:RELEASE_TAG" --draft --title "File Preview $releaseVersion" --generate-notes "outputs/release/FilePreview-Setup-$releaseVersion-x64.exe" "outputs/release/FilePreview-Setup-$releaseVersion-x64.exe.blockmap" "outputs/release/latest.yml" "outputs/release/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
